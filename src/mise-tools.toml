# Tools for setup.light (mise), installed as ~/.config/mise/conf.d/unixenv.toml.

[tools]
# basics
"conda:git" = "latest"
"conda:gnupg" = "latest"
"conda:nano" = "latest"
"conda:trash-cli" = { version = "latest", os = ["linux"] }
"conda:unzip" = "latest"
"conda:watch" = "latest"
"conda:wget" = "latest"

# shell
bat = "latest"
broot = "latest"
direnv = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
navi = { version = "latest", os = ["linux"] }
ripgrep = "latest"
starship = "latest"
zoxide = "latest"
"conda:zsh-autosuggestions" = { version = "latest", os = ["macos"] }
"conda:zsh-syntax-highlighting" = { version = "latest", os = ["macos"] }

# tools
delta = "latest"
gh = "latest"
glow = "latest"
"github:control-theory/gonzo" = "latest"
hyperfine = "latest"
jq = "latest"
"conda:mc" = "latest"
"conda:tig" = "latest"
tlrc = "latest"
yq = "latest"

# monitoring
bottom = "latest"
gping = "latest"
"conda:htop" = "latest"
"github:fujiapple852/trippy" = "latest"

# containers
helm = "latest"
k9s = "latest"
kubectl = "latest"

# remote sessions
"conda:mosh" = "latest"
tmux = "latest"
zellij = "latest"

# screensavers
"http:pipes-sh" = { version = "1.3.0", url = "https://github.com/pipeseroni/pipes.sh/archive/refs/tags/v{{version}}.tar.gz", checksum = "sha256:532976dd8dc2d98330c45a8bcb6d7dc19e0b0e30bba8872dcce352361655a426" }

# fonts
"github:microsoft/cascadia-code" = { version = "2407.24", os = ["macos"], checksum = "sha256:e67a68ee3386db63f48b9054bd196ea752bc6a4ebb4df35adce6733da50c8474" }

# genai
antigravity-cli = "latest"
claude-code = "latest"
codex = "latest"
crush = "latest"
