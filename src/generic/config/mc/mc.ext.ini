# Midnight Commander file actions: Enter runs Open, F3 runs View, F4 runs Edit.
# mc reads only this file once it exists, so setup appends the system rules from
# $(brew --prefix)/etc/mc/mc.ext.ini below it. The first matching section wins, so these come first.
# View commands without %view run in the terminal, so pagers keep their colors.

[mc.ext.ini]
Version=4.0

[unixenv json]
Regex=\\.json$
RegexIgnoreCase=true
View=jq -C . %f | less -R

[unixenv markdown]
Regex=\\.mk?d$
RegexIgnoreCase=true
Open=%var{EDITOR:vi} %f
View=glow -p %f

[unixenv source]
Regex=^(Dockerfile|Makefile)$|\\.(go|mod|py|rs|js|mjs|cjs|jsx|tsx|sh|bash|zsh|lua|rb|java|kt|swift|sql|proto|ya?ml|toml|ini|conf|cfg|xml|css|scss|tf|hcl)$
View=bat --paging=always --style=numbers %f
