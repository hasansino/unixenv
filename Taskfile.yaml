---

# Reference:
#   https://taskfile.dev/docs/reference/schema
# JSON schema:
#   https://taskfile.dev/schema.json

# ╭────────────────────----------------──────────╮
# │                    unixenv                   │
# ╰─────────────────────----------------─────────╯
#
# Before running any commands, ensure following tools are installed:
# - git @see https://git-scm.com/
# - mise @see https://mise.jdx.dev/
# - task @see https://taskfile.dev/
#
# Linters are pinned in etc/mise.toml and installed into .tools/ by `task setup`,
# apart from the machine environment this repository installs.
#
# This file can be executed manually, from CI, by IDE and invoked by AI.
#
# Write all task summaries as multiline literal blocks (summary: |-).
# Keep summary source lines at most 120 characters long, including indentation.

version: '3'

set:
  - errexit
  - pipefail

vars:
  # Sourced bash files (dotfiles, src/setup/lib.sh) have no shebang; setup also joins src/generic/* into the zsh files.
  BASH_SOURCED_FILES: >-
    src/generic/aliases
    src/generic/rc
    src/linux/bash_aliases
    src/linux/bash_profile
    src/linux/bashrc
    src/setup/lib.sh
  ZSH_FILES: >-
    src/macos/zprofile
    src/macos/zshrc
    src/macos/zsh_aliases
  SHFMT_FLAGS: -i 4 -ci -sr -bn

env:
  MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
  MISE_DATA_DIR: '{{.ROOT_DIR}}/.tools'
  MISE_CACHE_DIR: '{{.ROOT_DIR}}/.tools/cache'
  MISE_STATE_DIR: '{{.ROOT_DIR}}/.tools/state'
  TASK_TEMP_DIR: '{{.ROOT_DIR}}/.tools/task'

tasks:

  help:
    desc: "List available tasks in Taskfile order"
    aliases:
      - default
    cmds:
      - "task --list --sort none"

  env:export:
    desc: "Print the project tooling environment as KEY=value lines"
    summary: |-
      Usage: task env:export
      Prints project variables for CI setup and editor configuration.
    silent: true
    cmds:
      - |
        printf '%s\n' \
          "MISE_DEFAULT_CONFIG_FILENAME=$MISE_DEFAULT_CONFIG_FILENAME" \
          "MISE_DATA_DIR=$MISE_DATA_DIR" \
          "MISE_CACHE_DIR=$MISE_CACHE_DIR" \
          "MISE_STATE_DIR=$MISE_STATE_DIR" \
          "TASK_TEMP_DIR=$TASK_TEMP_DIR"

  # ╭────────────────────----------------──────────╮
  # │                   Tooling                    │
  # ╰─────────────────────----------------─────────╯

  tool:
    desc: "Run a command with the project tools"
    summary: |-
      Usage: task tool -- COMMAND [ARGS...]
    interactive: true
    silent: true
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: "Usage: task tool -- COMMAND [ARGS...]"
    cmds:
      - 'mise exec -- {{.CLI_ARGS}}'

  tool:update:
    desc: "Set a mise tool dependency to a version (writes)"
    summary: |-
      Usage: task tool:update TOOL=<tool> VERSION=<version>
      Installs the selected tool version, updates etc/mise.toml and etc/mise.lock, and removes its unused versions.
    requires:
      vars:
        - TOOL
        - VERSION
    preconditions:
      - sh: 'test -n {{.TOOL | shellQuote}} && test -n {{.VERSION | shellQuote}}'
        msg: "TOOL and VERSION must not be empty."
      - sh: 'test -z {{.CLI_ARGS | shellQuote}}'
        msg: "Pass TOOL=... VERSION=... without arguments after --."
    cmds:
      - 'mise use --pin -- {{printf "%s@%s" .TOOL .VERSION | shellQuote}}'
      - 'mise lock -- {{.TOOL | shellQuote}}'
      - 'mise prune --tools --yes -- {{.TOOL | shellQuote}}'

  setup:
    desc: "Install pinned project tools"
    summary: |-
      Usage: task setup
      Installs into .tools/; mise and Task must already be installed.
      Then runs setup:tidy, so versions replaced by new pins do not accumulate.
    cmds:
      - "mise install --locked"
      - task: setup:tidy

  setup:tidy:
    desc: "Remove unused tool versions and stale cache files from .tools/ (writes)"
    summary: |-
      Usage: task setup:tidy [DRY_RUN=1]
      Deletes installed versions that no tracked mise configuration selects, then cache files not read within
      cache_prune_age. Versions used by running processes are kept. DRY_RUN=1 lists what would be removed.
    cmds:
      - 'mise prune --tools --yes{{if .DRY_RUN}} --dry-run{{end}}'
      - 'mise cache prune{{if .DRY_RUN}} --dry-run{{end}}'

  # ╭────────────────────----------------──────────╮
  # │                   Testing                    │
  # ╰─────────────────────----------------─────────╯

  test:smoke:
    desc: "Run setup against a throwaway HOME and check the result (installs brew packages)"
    summary: |-
      Usage: task test:smoke
      Runs `setup --no-update` twice with HOME in a temporary directory, then checks managed blocks,
      installed configuration and shell startup. Brew packages and casks are installed globally, as setup does.
      CI runs it with `task --yes test:smoke`.
    prompt: "test:smoke runs setup, which installs brew packages and casks globally. Continue?"
    cmds:
      - "bash tests/smoke"

  test:smoke:light:
    desc: "Run setup.light against a throwaway HOME and check the result (downloads about 1 GB)"
    summary: |-
      Usage: task test:smoke:light
      Runs `setup.light --no-update` twice with HOME in a temporary directory and checks the result like
      test:smoke, plus mise and its tools. Everything, mise included, is written inside that HOME.
      CI runs it with `task --yes test:smoke:light`.
    cmds:
      - "bash tests/smoke --light"

  test:hop:
    desc: "Check hop's choices with fake ssh and mosh (read only, no network)"
    summary: |-
      Usage: task test:hop
      Runs src/bin/hop against a fake host: mosh or ssh, the fallbacks, and which session tool it picks,
      with sh and (where installed) csh as the host's login shell. Nothing outside a temporary directory.
    cmds:
      - "bash tests/hop"

  # ╭────────────────────----------------──────────╮
  # │                  Formatters                  │
  # ╰─────────────────────----------------─────────╯

  fmt:shell:
    desc: "Format shell scripts and dotfiles with shfmt (writes)"
    summary: |-
      Usage: task fmt:shell
      Formats the same files as lint:shell.
    vars:
      BASH_SCRIPTS: &bash_scripts
        sh: "git grep --untracked -lIE '^#!/(usr/)?bin/(env )?bash' -- ."
    cmds:
      - 'mise exec -- shfmt -ln bash {{.SHFMT_FLAGS}} -w {{.BASH_SCRIPTS | catLines}} {{.BASH_SOURCED_FILES}}'
      - 'mise exec -- shfmt -ln zsh {{.SHFMT_FLAGS}} -w {{.ZSH_FILES}}'

  fmt:json:
    desc: "Format explicit JSON files (writes)"
    summary: |-
      Usage: task fmt:json -- FILE.json [FILE.json ...]
    preconditions: &files
      - sh: |
          set -- {{.CLI_ARGS}}
          [ "$#" -gt 0 ]
        msg: "Pass explicit file paths after --."
      - &file_paths
        sh: |
          set -- {{.CLI_ARGS}}
          for file do
            case "$file" in
              -*|!*|*\**|*\?*|*\[*|*\]*|*\{*|*\}*) printf 'Expected a literal file path: %s\n' "$file" >&2; exit 2 ;;
            esac
            [ -f "$file" ] || { printf 'Expected an existing file: %s\n' "$file" >&2; exit 2; }
          done
        msg: "Pass explicit existing file paths after --."
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- jsonfmt -w "$@"

  fmt:yaml:
    desc: "Format explicit YAML files (writes)"
    summary: |-
      Usage: task fmt:yaml -- FILE.yaml [FILE.yaml ...]
    preconditions: *files
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- yamlfmt -conf etc/yamlfmt.yaml "$@"

  fmt:toml:
    desc: "Format explicit TOML files (writes)"
    summary: |-
      Usage: task fmt:toml -- FILE.toml [FILE.toml ...]
    preconditions: *files
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        for file do
          case "$file" in
            /*) ;;
            *) file="$PWD/$file" ;;
          esac
          # Tombi discovers etc/tombi.toml from its working directory.
          (cd etc && mise exec -- tombi format --offline "$file")
        done

  # ╭────────────────────----------------──────────╮
  # │                   Linters                    │
  # ╰─────────────────────----------------─────────╯

  lint:
    desc: "Run shell, configuration, and secret linters"
    summary: |-
      Usage: task lint
      Accepts no arguments; use a lint:* task to select files.
    preconditions:
      - sh: |
          set -- {{.CLI_ARGS}}
          [ "$#" -eq 0 ]
        msg: "Use a lint:* task for file arguments."
    cmds:
      - task: "lint:shell"
      - task: "lint:json"
      - task: "lint:yaml"
      - task: "lint:toml"
      - task: "lint:config"
      - task: "lint:secrets"

  lint:shell:
    desc: "Check shell scripts and dotfiles with ShellCheck and shfmt (read only)"
    summary: |-
      Usage: task lint:shell
      Bash scripts are found by shebang; sourced bash dotfiles and zsh files are listed in Taskfile vars.
      Zsh files are only parsed and format-checked by shfmt, because ShellCheck does not support zsh.
    vars:
      BASH_SCRIPTS: *bash_scripts
    cmds:
      - 'mise exec -- shellcheck --rcfile etc/shellcheckrc --shell=bash {{.BASH_SCRIPTS | catLines}} {{.BASH_SOURCED_FILES}}'
      - 'mise exec -- shfmt -ln bash {{.SHFMT_FLAGS}} -d {{.BASH_SCRIPTS | catLines}} {{.BASH_SOURCED_FILES}}'
      - 'mise exec -- shfmt -ln zsh {{.SHFMT_FLAGS}} -d {{.ZSH_FILES}}'

  lint:json:
    desc: "Check JSON source formatting, or explicit files (read only)"
    summary: |-
      Usage: task lint:json [-- FILE.json ...]
      Defaults to Git source JSON files.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.json'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            mise exec -- jsonfmt "$file"
          fi
        done

  lint:yaml:
    desc: "Check YAML source formatting, or explicit files (read only)"
    summary: |-
      Usage: task lint:yaml [-- FILE.yaml ...]
      Defaults to Git source YAML files.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.yaml' '*.yml'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            mise exec -- yamlfmt -conf etc/yamlfmt.yaml -lint "$file"
          fi
        done

  lint:toml:
    desc: "Check TOML source formatting and lint rules, or explicit files (read only)"
    summary: |-
      Usage: task lint:toml [-- FILE.toml ...]
      Defaults to Git source files ending in .toml.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.toml'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            case "$file" in
              /*) ;;
              *) file="$PWD/$file" ;;
            esac
            # Tombi discovers etc/tombi.toml from its working directory.
            (
              cd etc
              mise exec -- tombi format --offline --check "$file"
              mise exec -- tombi lint --offline --error-on-warnings "$file"
            )
          fi
        done

  lint:config:
    desc: "Check that git and ssh accept the shipped configuration files (read only)"
    summary: |-
      Usage: task lint:config
      Uses the system git and ssh, which parse each file and fail on malformed lines or unknown options.
    cmds:
      - |
        for file in src/generic/config/gitconfig src/generic/config/gitconfig.local; do
          printf 'Checking %s\n' "$file"
          git config --file "$file" --list > /dev/null
        done
      - |
        printf 'Checking %s\n' src/generic/config/ssh/config
        # -G prints the resolved settings without connecting; -T skips the pseudo-terminal notice.
        ssh -T -G -F src/generic/config/ssh/config example.invalid < /dev/null > /dev/null

  lint:secrets:
    desc: "Scan Git history, or explicit files, for secrets with Gitleaks"
    summary: |-
      Usage: task lint:secrets [-- FILE ...]
      Defaults to Git history. Explicit files are scanned directly, including ignored and untracked files.
      Findings are redacted; secret findings and scanner errors fail the task.
    preconditions:
      - *file_paths
    cmds:
      - |-
        set -- {{.CLI_ARGS}}
        if [ "$#" -eq 0 ]; then
          mise exec -- gitleaks git --no-banner --redact -v
        else
          for file do
            printf 'Scanning %s for secrets\n' "$file"
            mise exec -- gitleaks stdin --no-banner --redact < "$file"
          done
        fi
